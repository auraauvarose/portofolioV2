name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: tidak ada step di workflow ini yang butuh GITHUB_TOKEN untuk
# menulis (issue/PR/package). Job `deploy` tetap bisa deploy karena memakai
# secret Cloudflare (CLOUDFLARE_API_TOKEN), bukan GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Gate kualitas. Jalan untuk SEMUA event (push, pull_request, manual) supaya
  # PR diperiksa sebelum merge, bukan sesudahnya. Job ini tidak memakai secret
  # apa pun, jadi aman dijalankan untuk PR dari fork.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `tsx --test` mencetak "tests 0" dan TETAP exit 0 bila glob tidak
      # mencocokkan file apa pun, sehingga gate ini bisa hijau tanpa satu tes pun
      # (mis. folder tests/ ter-rename). Karena itu jumlah tes diverifikasi.
      #
      # `set -o pipefail` + pemeriksaan status eksplisit wajib: tanpa itu exit
      # code `npm test` yang gagal tertelan oleh `tee`, dan karena skrip berakhir
      # dengan `echo`, step ini akan lolos meski tesnya merah.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::npm test gagal dengan exit code $status."
            exit "$status"
          fi

          count="$(grep -aE '^(ℹ|#) tests [0-9]+[[:space:]]*$' /tmp/test-output.txt | tail -n 1 | grep -oE '[0-9]+' || true)"

          if [ -z "$count" ]; then
            echo "::error::Jumlah tes tidak terbaca dari output test runner — gate tidak bisa diverifikasi."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::Tidak ada tes yang dijalankan (tests 0). Periksa glob 'tests/**/*.test.ts'."
            exit 1
          fi

          echo "Jumlah tes yang dijalankan: $count"

  deploy:
    # Deploy HANYA untuk push ke main/master atau workflow_dispatch.
    # PR (termasuk dari fork) berhenti di job `quality`: build, `wrangler deploy`,
    # dan sinkronisasi secret tidak boleh jalan pada event pull_request.
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time, so
      # they must be present as env vars during the OpenNext/Next build.
      - name: Build (Next.js + OpenNext Worker)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          # Bila secret ini belum dibuat, fallback di src/lib/site.ts dipakai
          # (workers.dev) sehingga build tidak gagal.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENABLED || 'true' }}
        run: npm run cf:build

      # Deploy first so the Worker exists, then attach the server-only secrets.
      - name: Deploy
        run: npx wrangler deploy

      # Server-only runtime vars are needed by the Worker, so sync them as
      # Cloudflare secrets after the Worker has been created. Build the JSON
      # with jq so secret values with quotes/backslashes stay valid JSON.
      - name: Sync Worker secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_COOKIE_SECRET: ${{ secrets.ADMIN_COOKIE_SECRET }}
        run: |
          jq -n \
            '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
              R2_ACCOUNT_ID: env.R2_ACCOUNT_ID,
              R2_ACCESS_KEY_ID: env.R2_ACCESS_KEY_ID,
              R2_SECRET_ACCESS_KEY: env.R2_SECRET_ACCESS_KEY,
              R2_BUCKET_NAME: env.R2_BUCKET_NAME,
              ADMIN_PASSWORD: env.ADMIN_PASSWORD,
              ADMIN_COOKIE_SECRET: env.ADMIN_COOKIE_SECRET}' \
            > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          # Jangan tinggalkan berkas berisi kredensial di runner.
          rm -f /tmp/secrets.json
