name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time, so
      # they must be present as env vars during the OpenNext/Next build.
      - name: Build (Next.js + OpenNext Worker)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
        run: pnpm cf:build

      # Deploy first so the Worker exists, then attach the server-only secrets.
      - name: Deploy
        run: pnpm exec wrangler deploy

      # Server-only runtime vars are needed by the Worker, so sync them as
      # Cloudflare secrets after the Worker has been created. Build the JSON
      # with jq so secret values with quotes/backslashes stay valid JSON.
      - name: Sync Worker secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_COOKIE_SECRET: ${{ secrets.ADMIN_COOKIE_SECRET }}
        run: |
          jq -n \
            '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
              R2_ACCOUNT_ID: env.R2_ACCOUNT_ID,
              R2_ACCESS_KEY_ID: env.R2_ACCESS_KEY_ID,
              R2_SECRET_ACCESS_KEY: env.R2_SECRET_ACCESS_KEY,
              R2_BUCKET_NAME: env.R2_BUCKET_NAME,
              ADMIN_PASSWORD: env.ADMIN_PASSWORD,
              ADMIN_COOKIE_SECRET: env.ADMIN_COOKIE_SECRET}' \
            > /tmp/secrets.json
          pnpm exec wrangler secret bulk /tmp/secrets.json
